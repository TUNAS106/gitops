apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yas-preview
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/yas-configuration
      helm:
        releaseName: yas-configuration
        valueFiles:
          - $values/argocd/values/preview/yas-configuration.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/backoffice-bff
      helm:
        releaseName: backoffice-bff
        valueFiles:
          - $values/argocd/values/preview/backoffice-bff.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/backoffice-ui
      helm:
        releaseName: backoffice-ui
        valueFiles:
          - $values/argocd/values/preview/backoffice-ui.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/storefront-bff
      helm:
        releaseName: storefront-bff
        valueFiles:
          - $values/argocd/values/preview/storefront-bff.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/storefront-ui
      helm:
        releaseName: storefront-ui
        valueFiles:
          - $values/argocd/values/preview/storefront-ui.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/cart
      helm:
        releaseName: cart
        valueFiles:
          - $values/argocd/values/preview/cart.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/customer
      helm:
        releaseName: customer
        valueFiles:
          - $values/argocd/values/preview/customer.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/inventory
      helm:
        releaseName: inventory
        valueFiles:
          - $values/argocd/values/preview/inventory.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/location
      helm:
        releaseName: location
        valueFiles:
          - $values/argocd/values/preview/location.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/media
      helm:
        releaseName: media
        valueFiles:
          - $values/argocd/values/preview/media.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/order
      helm:
        releaseName: order
        valueFiles:
          - $values/argocd/values/preview/order.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/payment
      helm:
        releaseName: payment
        valueFiles:
          - $values/argocd/values/preview/payment.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/payment-paypal
      helm:
        releaseName: payment-paypal
        valueFiles:
          - $values/argocd/values/preview/payment-paypal.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/product
      helm:
        releaseName: product
        valueFiles:
          - $values/argocd/values/preview/product.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/promotion
      helm:
        releaseName: promotion
        valueFiles:
          - $values/argocd/values/preview/promotion.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/rating
      helm:
        releaseName: rating
        valueFiles:
          - $values/argocd/values/preview/rating.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/recommendation
      helm:
        releaseName: recommendation
        valueFiles:
          - $values/argocd/values/preview/recommendation.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/sampledata
      helm:
        releaseName: sampledata
        valueFiles:
          - $values/argocd/values/preview/sampledata.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/search
      helm:
        releaseName: search
        valueFiles:
          - $values/argocd/values/preview/search.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/tax
      helm:
        releaseName: tax
        valueFiles:
          - $values/argocd/values/preview/tax.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/webhook
      helm:
        releaseName: webhook
        valueFiles:
          - $values/argocd/values/preview/webhook.yaml

    - repoURL: https://github.com/TUNAS106/gitops.git
      targetRevision: main
      path: charts/swagger-ui
      helm:
        releaseName: swagger-ui
        valueFiles:
          - $values/argocd/values/preview/swagger-ui.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: yas-preview
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
